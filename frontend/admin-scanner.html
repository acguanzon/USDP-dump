<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • QR Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      .qr-scanner { position: relative; background: #111; border-radius: 12px; overflow: hidden; min-height: 280px; }
      .scanner-overlay { position: absolute; inset: 0; border: 2px dashed rgba(255,255,255,.4); border-radius: 12px; }
      .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: rgba(114, 179, 255, .8); animation: scan 2s linear infinite; }
      @keyframes scan { from { top: 10%; } to { top: 90%; } }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html"><img src="assets/logo.png" alt="USDP" height="28" class="me-2 align-middle" />Admin</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a class="btn btn-outline-light btn-sm" href="admin-dashboard.html">Dashboard</a>
          <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-logout>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-gradient mb-0">QR Scanner</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="qrStart"><i class="bi bi-camera-video me-2"></i>Start</button>
          <button class="btn btn-outline-secondary" id="qrStop"><i class="bi bi-stop-circle me-2"></i>Stop</button>
        </div>
      </div>
      <div class="card p-3">
        <div class="qr-scanner mb-2" id="qrPreview">
          <div class="scanner-overlay"></div>
          <div class="scan-line"></div>
          <video id="qrVideo" playsinline muted style="width:100%;height:auto"></video>
        </div>
        <div class="input-group">
          <input class="form-control" id="qrManual" placeholder="Paste code if camera unsupported" />
          <button class="btn btn-primary" id="qrManualSubmit">Validate</button>
        </div>
        <div class="small text-secondary mt-2" id="qrMsg"></div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/admin-scanner.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
