<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Discounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html"><img src="assets/logo.png" alt="USDP" height="28" class="me-2 align-middle" />Admin</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a class="btn btn-outline-light btn-sm" href="admin-dashboard.html">Dashboard</a>
          <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-logout>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-gradient mb-0">Discounts</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCreateDiscount"><i class="bi bi-plus-circle me-2"></i>Create Discount</button>
      </div>
      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>Title</th><th>ID</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="discountsTable"></tbody>
          </table>
        </div>
        <div class="d-flex justify-content-end"><button class="btn btn-outline-secondary btn-sm" id="btnLoadMore">Load More</button></div>
      </div>

      <div class="card p-3 mt-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h6 class="mb-0">Tokens for Discount</h6>
          <input class="form-control" style="max-width:260px" id="tListDiscountId" placeholder="Discount ID" />
        </div>
        <button class="btn btn-outline-secondary btn-sm mb-2" id="btnListTokens">Load Tokens</button>
        <div class="table-responsive">
          <table class="table table-compact table-striped mb-0">
            <thead><tr><th>Code</th><th>Expires</th></tr></thead>
            <tbody id="tokensTable"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modalCreateDiscount" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Create Discount</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <form id="formCreateDiscount">
            <div class="modal-body">
              <div class="mb-2"><input class="form-control" id="dTitle" placeholder="Title" required /></div>
              <div class="mb-2"><textarea class="form-control" id="dDesc" rows="3" placeholder="Description"></textarea></div>
              <div class="mb-2"><textarea class="form-control" id="dElig" rows="2" placeholder="Eligibility"></textarea></div>
              <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="dActive" checked /><label class="form-check-label" for="dActive">Active</label></div>
              <div class="small text-secondary" id="dMsg"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" type="submit">Create</button></div>
          </form>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin-discounts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
