<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login • UNOR-SSG Discounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-bg d-flex align-items-center justify-content-center py-5">
      <div class="container px-3">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-6 col-xl-5">
            <div class="glass-card p-4 p-md-5 text-white">
              <div class="text-center mb-3">
                <img src="assets/logo.png" alt="UNOR-SSG Seal" class="login-seal" style="height:90px;" />
              </div>
              <h2 class="text-center fw-bold mb-1">WELCOME</h2>
              <p class="text-center mb-4 text-white-50">Sign in to your account</p>
              <div class="role-selector d-flex justify-content-center mb-3">
                <button type="button" id="roleStudent" class="role-option active">Student</button>
                <button type="button" id="roleAdmin" class="role-option">Admin</button>
              </div>
              <input type="hidden" id="role" value="user">
              <form id="loginForm">
                <div class="mb-3 input-icon">
                  <i class="bi bi-person-fill icon"></i>
                  <input type="email" class="form-control form-control-lg" id="email" placeholder="Email" required />
                </div>
                <div class="mb-3 input-icon input-icon-right">
                  <i class="bi bi-key-fill icon"></i>
                  <input type="password" class="form-control form-control-lg" id="password" placeholder="Password" required />
                  <button type="button" tabindex="-1" id="toggleLoginPassword" class="btn-eye" aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-gradient w-100 btn-lg d-flex justify-content-center align-items-center">
                  <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-2" style="display:none;" role="status" aria-hidden="true"></span>
                  <span id="loginBtnText">LOGIN</span>
                </button>
                <div id="loginError" class="small mt-2 text-warning" role="alert" style="display:none;"></div>
              </form>
              <p class="text-center mt-3 mb-0 text-white-50">Don't have an account? <a class="text-warning" href="register.html">Sign Up</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
