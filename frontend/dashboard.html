<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Dashboard • UNOR-SSG Discounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-gradient">UNOR-SSG</span> Discounts</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample"><span class="navbar-toggler-icon"></span></button>
        <div id="navbarsExample" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" id="navRole" href="#"></a></li>
            <li class="nav-item ms-lg-2"><button type="button" class="btn btn-outline-secondary" id="logoutBtn" data-logout>Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h5 mb-0 text-gradient">Available Discounts</h3>
          </div>
          <div id="discountsLoading" class="text-center my-3">Loading discounts...</div>
          <div id="discountsList" class="row g-3"></div>

          <div class="mt-5">
            <h3 class="h5 mb-3 text-gradient">My Applications</h3>
            <div class="card">
              <div class="table-responsive">
                <table class="table mb-0">
                  <thead>
                    <tr>
                      <th>Discount</th>
                      <th>Status</th>
                      <th>Applied</th>
                    </tr>
                  </thead>
                  <tbody id="applicationsTable">
                    <tr id="appsLoading"><td colspan="3" class="text-center text-secondary">Loading...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card p-4">
            <h5 class="mb-3">My Profile</h5>
            <form id="profileForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" id="profileName" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" id="profileEmail" disabled />
              </div>
              <button class="btn btn-primary w-100">Save</button>
            </form>
          </div>
          <div class="card p-4 mt-3">
            <h5 class="mb-3">Redeem Token</h5>
            <form id="redeemForm">
              <input class="form-control mb-2" id="redeemCode" placeholder="Enter token code (e.g., UNOR-XXXXXX)" required />
              <button class="btn btn-accent w-100" type="submit">Redeem</button>
            </form>
            <div id="redeemMsg" class="small mt-2"></div>
          </div>
          <div class="card p-4 mt-3">
            <h5 class="mb-3">Student QR Code</h5>
            <div class="bg-light rounded p-3 d-inline-block mb-3">
              <div class="bg-white rounded d-flex align-items-center justify-content-center" style="width: 200px; height: 200px;">
                <span class="text-muted">QR CODE</span>
              </div>
            </div>
            <button class="btn btn-outline-primary w-100">Download QR Code</button>
          </div>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
