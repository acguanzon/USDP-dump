<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard • UNOR-SSG Discounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-gradient">UNOR-SSG</span> Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample"><span class="navbar-toggler-icon"></span></button>
        <div id="navbarsExample" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" id="navRole" href="#"></a></li>
            <li class="nav-item ms-lg-2"><button type="button" class="btn btn-outline-secondary" id="logoutBtn" data-logout>Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <ul class="nav nav-underline mb-4" id="adminTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#usersTab" type="button">Users</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#discountsTab" type="button">Discounts</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="usersTab">
          <div class="row g-3">
            <div class="col-lg-4">
              <div class="card p-4">
                <h5 class="mb-3">Add User</h5>
                <form id="addUserForm">
                  <input class="form-control mb-2" id="uName" placeholder="Full name" required />
                  <input type="email" class="form-control mb-2" id="uEmail" placeholder="Email" required />
                  <input type="password" class="form-control mb-2" id="uPassword" placeholder="Password" required />
                  <select class="form-select mb-3" id="uRole">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                  </select>
                  <button class="btn btn-primary w-100">Create</button>
                </form>
              </div>
            </div>
            <div class="col-lg-8">
              <div class="card p-3">
                <div class="table-responsive">
                  <table class="table mb-0 align-middle">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="usersTable">
                      <tr id="usersLoading"><td colspan="4" class="text-center text-secondary">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="d-flex justify-content-end mt-2">
                  <button class="btn btn-outline-secondary btn-sm" id="usersLoadMore">Load More</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="discountsTab">
          <div class="row g-3">
            <div class="col-lg-4">
              <div class="card p-4">
                <h5 class="mb-3">Create Discount</h5>
                <form id="addDiscountForm">
                  <input class="form-control mb-2" id="dTitle" placeholder="Title" required />
                  <textarea class="form-control mb-2" id="dDesc" placeholder="Description" rows="3"></textarea>
                  <textarea class="form-control mb-2" id="dElig" placeholder="Eligibility" rows="2"></textarea>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="dActive" checked />
                    <label class="form-check-label" for="dActive">Active</label>
                  </div>
                  <button class="btn btn-primary w-100">Create</button>
                </form>
              </div>
              <div class="card p-4 mt-3">
                <h5 class="mb-3">Generate Tokens</h5>
                <form id="genTokenForm">
                  <input class="form-control mb-2" id="tDiscountId" placeholder="Discount ID" required />
                  <div class="row g-2">
                    <div class="col-6"><input type="number" min="1" max="1000" value="1" class="form-control" id="tCount" placeholder="Count" /></div>
                    <div class="col-6"><input class="form-control" id="tPrefix" placeholder="Prefix (optional)" /></div>
                  </div>
                  <input class="form-control mt-2" id="tExpires" type="datetime-local" placeholder="Expires At (optional)" />
                  <button class="btn btn-primary w-100 mt-2">Generate</button>
                </form>
                <div id="genTokenResult" class="small text-secondary mt-2" style="white-space: pre-wrap;"></div>
              </div>
            </div>
            <div class="col-lg-8">
              <div class="card p-3">
                <div class="table-responsive">
                  <table class="table mb-0 align-middle">
                    <thead><tr><th>Title</th><th>ID</th><th>Status</th><th>Applicants</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="discountsTable">
                      <tr id="discountsLoading"><td colspan="5" class="text-center text-secondary">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="d-flex justify-content-end mt-2">
                  <button class="btn btn-outline-secondary btn-sm" id="discountsLoadMore">Load More</button>
                </div>
              </div>
              <div class="card p-3 mt-3">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <h6 class="mb-0">Tokens for Discount</h6>
                  <input class="form-control" style="max-width:260px" id="tListDiscountId" placeholder="Discount ID" />
                </div>
                <button class="btn btn-outline-secondary btn-sm mb-2" id="btnListTokens">Load Tokens</button>
                <div class="table-responsive">
                  <table class="table table-sm mb-0">
                    <thead><tr><th>Code</th><th>Used</th><th>Used By</th><th>Expires</th></tr></thead>
                    <tbody id="tokensTable"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
