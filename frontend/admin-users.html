<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html"><img src="assets/logo.png" alt="USDP" height="28" class="me-2 align-middle" />Admin</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a class="btn btn-outline-light btn-sm" href="admin-dashboard.html">Dashboard</a>
          <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-logout>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-gradient mb-0">User Management</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddUser"><i class="bi bi-person-plus me-2"></i>Add User</button>
      </div>
      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Student ID</th><th>Card Type</th><th>Role</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
        <div class="d-flex justify-content-end"><button class="btn btn-outline-secondary btn-sm" id="btnLoadMore">Load More</button></div>
      </div>
    </main>

    <div class="modal fade" id="modalAddUser" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Add User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <form id="formAddUser">
            <div class="modal-body">
              <div class="mb-2"><input class="form-control" id="uName" placeholder="Full name" required /></div>
              <div class="mb-2"><input type="email" class="form-control" id="uEmail" placeholder="Email" required /></div>
              <div class="mb-2"><input type="password" class="form-control" id="uPassword" placeholder="Password" required /></div>
              <div class="mb-2"><input class="form-control" id="uStudentId" placeholder="Student ID (e.g., 2025-00001)" /></div>
              <div class="mb-2">
                <label class="form-label">Card Type</label>
                <select class="form-select" id="uCardType"><option value="blue">Blue</option><option value="gold">Gold</option></select>
              </div>
              <div class="mb-2">
                <select class="form-select" id="uRole"><option value="user">User</option><option value="admin">Admin</option></select>
              </div>
              <div class="small text-secondary" id="uMsg"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" type="submit">Create</button></div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalUserCard" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">User Card</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <div class="card" id="cardPreview" style="border-radius:16px; overflow:hidden;">
                  <div id="cardHeader" class="p-3 text-white" style="background:linear-gradient(135deg,#1E40AF,#6D28D9)">
                    <div class="d-flex justify-content-between align-items-center">
                      <strong>USDP Student Card</strong>
                      <span class="badge bg-primary" id="cardTypeBadge">BLUE</span>
                    </div>
                  </div>
                  <div class="p-3">
                    <div class="d-flex align-items-center">
                      <div class="flex-grow-1">
                        <div class="fw-bold" id="cardName">—</div>
                        <div class="text-secondary small">ID: <span id="cardStudentId">—</span></div>
                      </div>
                      <canvas id="cardQr" width="128" height="128" style="border-radius:8px; background:#fff"></canvas>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Student ID</label>
                <input class="form-control" id="editStudentId" />
              </div>
              <div class="col-12">
                <label class="form-label">Card Type</label>
                <select class="form-select" id="editCardType"><option value="blue">Blue</option><option value="gold">Gold</option></select>
              </div>
              <div class="small text-secondary" id="cardMsg"></div>
            </div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary" id="saveCard">Save</button></div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin-users.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
