<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
      <div class="container">
        <a class="navbar-brand" href="admin-dashboard.html"><img src="assets/logo.png" alt="USDP" height="28" class="me-2 align-middle" />Admin</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a class="btn btn-outline-light btn-sm" href="admin-dashboard.html">Dashboard</a>
          <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-logout>Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-gradient mb-0">Event Management</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddEvent"><i class="bi bi-calendar-plus me-2"></i>Add Event</button>
      </div>
      <div class="card p-3">
        <div id="eventsAdminList" class="row g-3"></div>
      </div>
    </main>

    <div class="modal fade" id="modalAddEvent" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Add Event</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <form id="formAddEvent">
            <div class="modal-body">
              <div class="mb-2"><input class="form-control" id="eTitle" placeholder="Title" required /></div>
              <div class="mb-2"><textarea class="form-control" id="eDesc" placeholder="Description" rows="3"></textarea></div>
              <div class="mb-2"><input type="date" class="form-control" id="eDate" required /></div>
              <div class="mb-2"><input class="form-control" id="eLocation" placeholder="Location" /></div>
              <div id="eMsg" class="small text-secondary"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-primary" type="submit">Save</button></div>
          </form>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin-events.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
 </html>
